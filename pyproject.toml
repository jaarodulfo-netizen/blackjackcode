[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-scanner"
version = "0.1.0"
description = "Linux blackjack app that reads barcoded cards from an HID scanner and streams events to AWS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Alvarez", email = "jaarodulfo@gmail.com" }]
license = { text = "MIT" }
keywords = ["blackjack", "barcode", "hid", "aws", "gaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
ui = ["streamlit>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5.0",
    "mypy>=1.8",
]

[project.scripts]
blackjack-scanner = "blackjack_scanner.cli:main"
blackjack-scanner-ui = "blackjack_scanner.ui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blackjack_scanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["blackjack_scanner"]
mypy_path = "src"
